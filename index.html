<!DOCTYPE html>
<html lang="en-US">
  <head>
    <link rel="canonical" href="https://www.lmtlabs.com/">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" type="text/css" href="/style.css">
    <meta charset="utf-8">
    <meta name="description" content="LMT Labs is a Maryland-based data recovery and digital forensics firm supporting individuals and organizations in the National Capital Region of the United States.">
    <meta name="robots" content="noarchive">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LMT Labs: Data Recovery & Digital Forensics</title>
    
    <style>
      /* Modern, simple styling */
      :root {
        --bg-color: #f8fafc;       /* A very subtle, clinical slate-blue background */
        --text-main: #1e293b;      /* Dark slate for high contrast */
        --text-muted: #475569;     /* Softer slate for the paragraph */
        --accent: #0284c7;         /* Professional trust blue */
      }

      body {
        margin: 0;
        padding: 0;
        /* Uses the user's native operating system font for a fast, modern look */
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        
        /* Centers the content vertically and horizontally */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }

      .container {
        max-width: 500px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      header img {
        max-width: 100%;
        height: auto;
      }

      main p {
        font-size: 1.125rem;
        line-height: 1.6;
        color: var(--text-muted);
        margin: 0;
      }

      footer {
        margin-top: 1rem;
      }

      /* Styles the email link as a modern button */
      footer a {
        display: inline-block;
        background-color: var(--accent);
        color: white;
        text-decoration: none;
        padding: 0.75rem 1.75rem;
        border-radius: 6px;
        font-weight: 500;
        transition: background-color 0.2s ease, transform 0.1s ease;
      }

      footer a:hover {
        background-color: #0369a0;
      }
      
      footer a:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <img src="/header.webp" alt="LMT Labs" width="302">
      </header>
      <main>
        <p>LMT Labs is a Maryland-based data recovery and digital forensics firm supporting individuals and organizations in the National Capital Region of the United States.</p>
      </main>
      <footer>

      </footer>
    </div>
  </body>
</html>
